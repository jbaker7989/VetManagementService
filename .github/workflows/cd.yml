name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      sha-tag: ${{ steps.sha-tag.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The built-in GITHUB_TOKEN is enough for ghcr.io; no registry secret is needed.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action lowercases the repository name, which ghcr.io requires.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The immutable tag staging deploys, taken from the tags that were just pushed.
      - id: sha-tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "tag=$(grep -o 'sha-[0-9a-f]*' <<< "$TAGS" | head -n1)" >> "$GITHUB_OUTPUT"

  deploy-staging:
    # Release tags are published only; production is deployed by hand (production.yml).
    if: github.ref == 'refs/heads/main'
    needs: publish
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
      issues: write
    with:
      environment: staging
      image-tag: ${{ needs.publish.outputs.sha-tag }}
