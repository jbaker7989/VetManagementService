name: CI

on:
  pull_request:
    branches: [main]
  # Reused by cd.yml so a release is never published without passing the same checks.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede stale PR runs; never cancel a run that gates a publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Builds the image itself (and enforces the size budget), then runs it against the runner's daemon.
      - run: npm run test:docker
