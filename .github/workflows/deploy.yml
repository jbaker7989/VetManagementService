name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (staging or production)
        required: true
        type: string
      image-tag:
        description: Already-published image tag to run
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time; a running deploy is never cancelled.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      issues: write
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - id: target
        name: Check inputs and deploy target
        run: |
          # The tag is interpolated into remote commands below, so restrict it to docker tag characters.
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || { echo "::error::Invalid image tag"; exit 1; }
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice title=Deploy skipped::DEPLOY_HOST is not set for the $ENVIRONMENT environment, so nothing was deployed."
            exit 0
          fi
          : "${DEPLOY_USER:?DEPLOY_USER is not set}" "${APP_URL:?APP_URL is not set}"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          # ghcr.io requires a lowercase image name.
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - if: steps.target.outputs.configured == 'true'
        uses: actions/checkout@v4

      - if: steps.target.outputs.configured == 'true'
        name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          # Pinned host key; connections to any other key are refused.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            BatchMode yes
          CONFIG

      - if: steps.target.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.target.outputs.configured == 'true'
        name: Verify image exists
        run: docker manifest inspect "ghcr.io/$IMAGE_REPO:$IMAGE_TAG" > /dev/null

      - if: steps.target.outputs.configured == 'true'
        name: Pull image on the VM
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh target 'mkdir -p vet-agent'
          scp docker-compose.deploy.yml target:vet-agent/
          # Short-lived job token so the VM needs no stored registry credential.
          printf '%s' "$REGISTRY_TOKEN" | ssh target docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'ssh target docker logout ghcr.io' EXIT
          ssh target bash -s -- "$IMAGE_REPO" "$IMAGE_TAG" <<'REMOTE'
          cd vet-agent
          IMAGE_REPO=$1 IMAGE_TAG=$2 docker compose -f docker-compose.deploy.yml pull
          REMOTE

      - if: steps.target.outputs.configured == 'true'
        id: switch
        name: Switch to the new image
        run: |
          ssh target bash -s -- "$IMAGE_REPO" "$IMAGE_TAG" <<'REMOTE'
          set -euo pipefail
          cd vet-agent
          # Remember the running tag so a failed deploy can be reverted (skipped when redeploying the same tag).
          running=$(docker ps -q --filter label=com.docker.compose.project=vet-agent --filter label=com.docker.compose.service=app | head -n1)
          if [ -n "$running" ]; then
            current=$(docker inspect --format '{{.Config.Image}}' "$running")
            [ "${current##*:}" = "$2" ] || echo "${current##*:}" > .previous-tag
          fi
          IMAGE_REPO=$1 IMAGE_TAG=$2 docker compose -f docker-compose.deploy.yml up -d --wait
          REMOTE

      - if: steps.target.outputs.configured == 'true'
        id: smoke
        name: Smoke test
        # APP_URL's hostname must be listed in ALLOWED_HOSTS on the VM, or the app answers 403.
        run: curl --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 5 --retry-connrefused "$APP_URL/health"

      - if: failure() && (steps.switch.outcome == 'failure' || steps.smoke.outcome == 'failure')
        id: rollback
        name: Roll back to the previous image
        run: |
          ssh target bash -s -- "$IMAGE_REPO" <<'REMOTE'
          set -euo pipefail
          cd vet-agent
          [ -s .previous-tag ] || { echo "No previous tag recorded; nothing to roll back to" >&2; exit 1; }
          # The previous image is still cached on the VM, so no pull or registry login is needed.
          IMAGE_REPO=$1 IMAGE_TAG=$(cat .previous-tag) docker compose -f docker-compose.deploy.yml up -d --wait
          REMOTE

      - if: failure()
        name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          gh issue create \
            --title "Deploy failed: $ENVIRONMENT $IMAGE_TAG" \
            --body "Deploying \`$IMAGE_TAG\` to **$ENVIRONMENT** failed. Rollback: $ROLLBACK (\`skipped\` means the failure came before the switch).

          Run: $RUN_URL"
