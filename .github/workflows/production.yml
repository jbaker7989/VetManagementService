name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Published image tag to deploy (e.g. sha-1a2b3c4 or 1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    # The production environment's required reviewers gate this job.
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
      issues: write
    with:
      environment: production
      image-tag: ${{ inputs.image-tag }}
